name: CI

# Pipeline: unit tests (BE + FE in parallel) -> docker build -> tag + publish.
# Tagging/publishing only runs on push to master (covers direct push and PR merge).
# Every stage is gated via `needs`; a failure stops downstream stages.

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/jahrulnr/buatpostingan

jobs:
  test-be:
    name: Test (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

  test-fe:
    name: Test (FE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: node --test
        run: node --test "web/**/*.test.mjs"

  docker-build:
    name: Docker build
    needs: [test-be, test-fe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE }}:ci-build
          cache-from: type=gha
          cache-to: type=gha,mode=max

  tag-and-publish:
    name: Tag & Publish
    needs: docker-build
    # Only on push to master (direct push OR PR merge). Skipped on PRs and
    # non-master branches. PR merge arrives here as a push event.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      published: ${{ steps.decide.outputs.published }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          if [ -z "$v" ]; then
            echo "VERSION file is empty — refusing to tag"; exit 1
          fi
          # Reject obvious non-semver to avoid malformed tags.
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$'; then
            echo "VERSION '$v' is not semver (expected x.y.z)"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          echo "Detected version: $v (tag v$v)"

      - name: Decide tag & publish
        id: decide
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if git ls-remote --tags origin "refs/tags/${tag}" | grep -q .; then
            echo "Tag ${tag} already exists — skipping tag & publish."
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag ${tag} is new — will publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.decide.outputs.published == 'true'

      - name: Login to GHCR
        if: steps.decide.outputs.published == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        if: steps.decide.outputs.published == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create git tag
        if: steps.decide.outputs.published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"
          echo "Pushed tag ${{ steps.version.outputs.tag }}"
