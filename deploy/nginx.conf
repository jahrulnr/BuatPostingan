server {
    listen 1212;
    server_name _;
    charset utf-8;

    # The administrative workspace is intentionally separate from published pages.
    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        alias /app/web/;
        index index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:1313;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:1313;
        proxy_set_header Host $host;
    }

    # Homepage is the published, agent-editable home workspace. It does not
    # expose drafts, nor does it make unknown paths resolve to the admin UI.
    location = / {
        root /app/storage/pages/.published;
        try_files /home/index.html =404;
    }

    # Only publication symlinks are public. Draft sources stay outside this root.
    location / {
        root /app/storage/pages/.published;
        index index.html;
        try_files $uri $uri/ =404;
    }
}
